name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farmacia
          POSTGRES_PASSWORD: farmacia_ci
          POSTGRES_DB: farmacia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmacia -d farmacia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://farmacia:farmacia_ci@localhost:5432/farmacia_test?schema=public
      DATABASE_URL: postgresql://farmacia:farmacia_ci@localhost:5432/farmacia_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas (API + Web)
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Revisar scripts de respaldo
        run: shellcheck scripts/*.sh

  # Navegador real (Chromium) contra la API y la interfaz compiladas
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farmacia
          POSTGRES_PASSWORD: farmacia_ci
          POSTGRES_DB: farmacia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmacia -d farmacia_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_DATABASE_URL: postgresql://farmacia:farmacia_ci@localhost:5432/farmacia_e2e?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas de punta a punta
        run: npm run test:e2e

      - name: Reporte de fallas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Las imágenes de Docker se construyen igual que en el servidor de la farmacia
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Sólo para validar el archivo: no se levanta ningún servicio
      POSTGRES_PASSWORD: ci-solo-validacion
      JWT_ACCESS_SECRET: ci-solo-validacion-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose (con y sin HTTPS)
        run: |
          docker compose config -q
          docker compose --profile https config -q

      - name: Construir imágenes
        run: docker compose build
