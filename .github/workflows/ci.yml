name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: farmacia
          POSTGRES_PASSWORD: farmacia_ci
          POSTGRES_DB: farmacia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmacia -d farmacia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://farmacia:farmacia_ci@localhost:5432/farmacia_test?schema=public
      DATABASE_URL: postgresql://farmacia:farmacia_ci@localhost:5432/farmacia_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Pruebas (API + Web)
        run: npm test

      - name: Build de producción
        run: npm run build
